version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: phobo-mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pho_bo_management}
      MYSQL_USER: ${MYSQL_USER:-phobo_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-your_mysql_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-your_root_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-your_root_password}"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phobo-phpmyadmin
    restart: always
    ports:
      - "${PHPMYADMIN_PORT:-8082}:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:-your_root_password}
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
    driver: local
